services:
  - type: web
    name: true-or-trained-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://trueortrained.com
      # The pairs manifest (answer key) is uploaded as a Render Secret File, never committed.
      - key: PAIRS_FILE
        value: /etc/secrets/manifest.json
      - key: IMAGE_BASE_URL
        value: https://images.trueortrained.com
