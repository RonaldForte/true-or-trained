# Local development database. Production uses Supabase, which runs the same Postgres major version.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tot
      POSTGRES_PASSWORD: tot
      POSTGRES_DB: true_or_trained
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tot -d true_or_trained"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
